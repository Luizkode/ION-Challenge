<h2>Recuperação de acesso ao ION OS</h2>
<p>
  Se você solicitou a recuperação do seu acesso, use o link abaixo para definir
  uma nova senha.
</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery"
    >Definir nova senha</a
  >
</p>
<p>
  Se você não fez esta solicitação, ignore este email. Sua senha permanece
  inalterada.
</p>
